services:
  postgres:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: sevak
      POSTGRES_USER: sevak
      POSTGRES_PASSWORD: sevak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  matching-engine:
    build:
      context: ../matching-engine
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  backend:
    build:
      context: ../backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://sevak:sevak@postgres:5432/sevak
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017/sevak
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 1209600
      MATCHING_ENGINE_URL: http://matching-engine:8000
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - mongo
      - matching-engine

volumes:
  postgres_data:
  redis_data:
  mongo_data:

